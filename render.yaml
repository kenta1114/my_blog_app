version: "1"
services:
  - type: web
    name: my-blog-app
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    plan: free
    env: ruby
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 1
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: my-blog-app-db
          property: connectionString
  - type: pserv
    name: my-blog-app-db
    runtime: postgres
    plan: free
    databaseName: my_blog_app_production
    databaseUser: my_blog_app
